<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">MTM-Bench: three language roles</title>
  <desc id="description">An academic pastel banner with three connected speech bubbles for instruction language EN, content language ES, and response language Chinese.</desc>
  <rect width="1200" height="360" fill="#FDFBF6"/>
  <path d="M0 0h1200v12H0z" fill="#D9C8EA"/>
  <path d="M0 348h1200v12H0z" fill="#DCEFE7"/>

