  <text x="58" y="176" fill="#283E3D" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="700">MTM-Bench</text>
  <text x="64" y="221" fill="#4D6260" font-family="Arial, Helvetica, sans-serif" font-size="23">Three roles. Twenty-seven triplets.</text>
  <text x="64" y="263" fill="#4D6260" font-family="Arial, Helvetica, sans-serif" font-size="23">One question: can the model follow through?</text>

